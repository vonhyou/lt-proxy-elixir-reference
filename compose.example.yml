# cp .env.example .env, fill it in, then: docker compose -f compose.example.yml up -d
services:
  lt-proxy:
    image: ghcr.io/vonhyou/lt-proxy-elixir-reference:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000" # translation API
      - "127.0.0.1:5001:5001" # admin panel, host loopback only
    volumes:
      - lt-proxy-data:/app/data

volumes:
  lt-proxy-data:
